<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Flappy Character Tournament</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --accent-yellow: #f1c40f;
            --panel-bg: rgba(30, 41, 59, 0.95);
            --border-ui: #334155;
            --text-light: #f8fafc;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #viewport {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 430px;
            max-height: 860px;
            aspect-ratio: 9 / 16;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
            overflow: hidden;
            background: #4ec0ca;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 15px;
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-light);
            z-index: 10;
            transition: opacity 0.25s ease;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
        .ui-panel {
            background: var(--panel-bg);
            border: 2px solid var(--border-ui);
            border-radius: 16px;
            width: 100%;
            padding: 15px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.8rem;
            color: var(--accent-yellow);
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .currency-badge {
            display: inline-block;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--accent-yellow);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: var(--accent-yellow);
            margin-bottom: 10px;
        }
        .btn {
            background: #e67e22;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0px #d35400;
            width: 80%;
            margin: 4px 0;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px #d35400;
        }
        .btn.secondary {
            background: #34495e;
            box-shadow: 0 4px 0px #2c3e50;
        }
        /* Dashboard Container Splitting */
        .content-split-box {
            display: flex;
            width: 100%;
            gap: 10px;
            flex-grow: 1;
            margin: 10px 0;
            overflow: hidden;
        }
        .character-container, .leaderboard-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .grid-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .character-grid, .leaderboard-list {
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border-ui);
            flex-grow: 1;
            overflow-y: auto;
        }
        .char-card {
            background: #334155;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-size: 0.75rem;
            margin-bottom: 8px;
        }
        .char-card.selected { border-color: var(--accent-yellow); background: #1e293b; }
        .char-card.locked { opacity: 0.7; background: #1e293b; }
        .char-preview { width: 24px; height: 24px; margin-bottom: 4px; border-radius: 50%; }
        
        /* Leaderboard Styling */
        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            font-size: 0.75rem;
            border-bottom: 1px solid #334155;
            color: #cbd5e1;
        }
        .leaderboard-row.highlight { color: #f1c40f; font-weight: bold; }
        
        /* Registration Overlay */
        input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid var(--border-ui);
            background: #0f172a;
            color: #fff;
            text-align: center;
            outline: none;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div id="viewport">
    <canvas id="gameCanvas"></canvas>

    <!-- First Time Setup Overlay -->
    <div id="onboardingScreen" class="screen-overlay hidden" style="z-index: 20; background: rgba(15, 23, 42, 0.98);">
        <div class="ui-panel" style="margin-top: auto; margin-bottom: auto;">
            <h1>PILOT SIGN-IN</h1>
            <div style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px;">Establish a global nickname for worldwide rankings</div>
            <input type="text" id="pilotNameInput" placeholder="ENTER NAME" maxlength="10">
            REGISTER PILOT</button>
        </div>
    </div>

    <!-- Main Menu Layout -->
    <div id="mainMenu" class="screen-overlay">
        <div class="ui-panel">
            <h1 id="menuHeader">FLAPPY SQUAD</h1>
            <div class="currency-badge">🪙 FEATHERS: <span id="menuCoins">0</span></div>
            <div><button class="btn" id="startBtn">TAP TO FLY</button></div>
        </div>

        <div class="content-split-box">
            <!-- Left Side: Character Grid -->
            <div class="character-container ui-panel">
                <div class="grid-title">SKINS</div>
                <div class="character-grid" id="charGrid"></div>
            </div>
            <!-- Right Side: Global Leaderboard -->
            <div class="leaderboard-container ui-panel">
                <div class="grid-title">WORLD TOP 10</div>
                <div class="leaderboard-list" id="globalLeadGrid">
                    <div style="font-size:0.7rem; color:#94a3b8; padding-top:20px;">Fetching global ledger...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Over Layout -->
    <div id="gameOverMenu" class="screen-overlay hidden">
        <div class="ui-panel" style="margin-top: auto; margin-bottom: auto;">
            <h1>RUN COMPLETE</h1>
            <div id="scoreBadge" style="font-size: 3rem; margin: 5px 0; font-weight: bold;">0</div>
            <div style="color: #cbd5e1; font-size: 0.9rem; margin-bottom: 5px;">BEST RUN: <span id="bestScore">0</span></div>
            <div style="color: var(--accent-yellow); font-size: 0.9rem; font-weight: bold; margin-bottom: 15px;">+<span id="earnedCoins">0</span> FEATHERS EARNED</div>
            <div id="networkStatus" style="font-size: 0.75rem; color:#94a3b8; margin-bottom: 15px;">Syncing cloud ledger...</div>
            <button class="btn" id="restartBtn">FLY AGAIN</button>
            <button class="btn secondary" id="lobbyBtn">BACK TO LOBBY</button>
        </div>
    </div>
</div>

<script>
/**
 * Flappy Bird Engine - Global Cloud Sync Architecture
 */

(function () {
    'use strict';

    let playerWallet = { nickname: "", coins: 0, highScore: 0, activeSkin: "classic", unlocked: ["classic"] };

    // --- REALTIME LIVE LEDGER CONFIG ---
    const BIN_URL = 'jsonbin.io';
    const MASTER_KEY = '$2a$10$9GvFhXkZ8e.2Qp9NBy8Nbe6dDlzxM66mF8p7gKxlmFh4t1Z5rGvIq';
    let globalLeaderboard = [];

    const characterDatabase = [
        { id: "classic", name: "Classic", color: "#f1c40f", edge: "#d35400", price: 0, img: "skin_classic.png" },
        { id: "robin", name: "Robin", color: "#e74c3c", edge: "#c0392b", price: 15, img: "skin_robin.png" },
        { id: "neon", name: "Cyber", color: "#00ffcc", edge: "#00b399", price: 35, img: "skin_cyber.png" },
        { id: "shadow", name: "Shadow", color: "#2c3e50", edge: "#1a252f", price: 60, img: "skin_shadow.png" },
        { id: "phoenix", name: "Phoenix", color: "#9b59b6", edge: "#8e44ad", price: 100, img: "skin_phoenix.png" },
        { id: "gold", name: "Gold", color: "#ffffff", edge: "#b59410", price: 200, img: "skin_gold.png", isGold: true }
    ];

    const skinImages = {};
    const skinLoadStatus = {};
    const backgroundImage = new Image();
    let bgLoaded = false;

    const audioAssets = { bgm: new Audio(), jump: new Audio(), score: new Audio(), death: new Audio() };
    const audioStatus = { bgm: false, jump: false, score: false, death: false };
    let audioInitialized = false;

    function initAudioAssets() {
        audioAssets.bgm.src = 'bgm.mp3'; audioAssets.bgm.loop = true; audioAssets.bgm.volume = 0.3;
        audioAssets.jump.src = 'jump.mp3'; audioAssets.jump.volume = 0.5;
        audioAssets.score.src = 'score.mp3'; audioAssets.score.volume = 0.5;
        audioAssets.death.src = 'death.mp3'; audioAssets.death.volume = 0.6;

        Object.keys(audioAssets).forEach(key => {
            audioAssets[key].oncanplaythrough = () => { audioStatus[key] = true; };
            audioAssets[key].onerror = () => { audioStatus[key] = false; };
        });
    }

    function unlockAudioContext() {
        if (audioInitialized) return;
        Object.keys(audioAssets).forEach(key => audioAssets[key].load());
        audioInitialized = true;
        manageMusicPlayback();
    }

    function manageMusicPlayback() {
        if (!audioInitialized || !audioStatus.bgm) return;
        if (gameState === 'PLAYING') audioAssets.bgm.play().catch(() => {});
        else audioAssets.bgm.pause();
    }

    function triggerSFX(channel) {
        if (!audioInitialized || !audioStatus[channel]) return;
        try { audioAssets[channel].currentTime = 0; audioAssets[channel].play().catch(() => {}); } catch (e) {}
    }

    function initAssets() {
        backgroundImage.src = 'bg.png';
        backgroundImage.onload = () => { bgLoaded = true; };
        characterDatabase.forEach(char => {
            skinImages[char.id] = new Image(); skinImages[char.id].src = char.img;
            skinImages[char.id].onload = () => { skinLoadStatus[char.id] = true; };
            skinImages[char.id].onerror = () => { skinLoadStatus[char.id] = false; };
        });
        initAudioAssets();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const viewport = document.getElementById('viewport');
    let scale = 1, virtualWidth = 360, virtualHeight = 640;
    let gameState = 'MENU', ticks = 0, currentScore = 0, bgScrollX = 0;
    let birdEntity = null, activePipes = [];

    function resizeDisplay() {
        const w = viewport.clientWidth, h = viewport.clientHeight;
        canvas.width = w; canvas.height = h; scale = w / virtualWidth;
        ctx.imageSmoothingEnabled = false;
    }
    window.addEventListener('resize', resizeDisplay);
    resizeDisplay();

    // --- IDENTITY MATRIX LOGIC ---
    function checkIdentityMatrix() {
        const storedName = localStorage.getItem('flappy_pilot_name');
        const savedData = localStorage.getItem('flappy_profile_save');
        
        if (savedData) {
            try { playerWallet = { ...playerWallet, ...JSON.parse(savedData) }; } catch (e) {}
        }

        if (!storedName) {
            document.getElementById('onboardingScreen').classList.remove('hidden');
        } else {
            playerWallet.nickname = storedName;
            document.getElementById('menuHeader').innerText = playerWallet.nickname;
            document.getElementById('menuCoins').innerText = playerWallet.coins;
            buildCharacterGridUI();
            fetchCloudLeaderboard();
        }
    }

    function saveNewIdentity() {
        const nameInput = document.getElementById('pilotNameInput');
        const finalName = nameInput.value.trim().toUpperCase();
        if (finalName.length < 2) return alert("NAME MUST BE AT LEAST 2 CHARACTERS!");
        
        localStorage.setItem('flappy_pilot_name', finalName);
        playerWallet.nickname = finalName;
        document.getElementById('menuHeader').innerText = playerWallet.nickname;
        document.getElementById('onboardingScreen').classList.add('hidden');
        commitSavedState();
        fetchCloudLeaderboard();
    }

    function commitSavedState() {
        localStorage.setItem('flappy_profile_save', JSON.stringify(playerWallet));
        document.getElementById('menuCoins').innerText = playerWallet.coins;
    }

    // --- LEADERBOARD & SYNC NETWORKING ---
    async function fetchCloudLeaderboard() {
        try {
            const res = await fetch(BIN_URL, { headers: { 'X-Master-Key': MASTER_KEY } });
            if (res.ok) {
                const packet = await res.json();
                if (packet.record && Array.isArray(packet.record.scores)) {
                    globalLeaderboard = packet.record.scores;
                    renderLeaderboardUI();
                }
            }
        } catch (e) { console.warn("Cloud connection interrupted."); }
    }

    async function pushScoreToCloud() {
        document.getElementById('networkStatus').innerText = "Transmitting score to cloud ledger...";
        
        // Find existing index or append new record
        const existIndex = globalLeaderboard.findIndex(p => p.name === playerWallet.nickname);
        if (existIndex !== -1) {
            if (playerWallet.highScore > globalLeaderboard[existIndex].score) {
                globalLeaderboard[existIndex].score = playerWallet.highScore;
            }
        } else {
            globalLeaderboard.push({ name: playerWallet.nickname, score: playerWallet.highScore });
        }

        globalLeaderboard.sort((a, b) => b.score - a.score);
        globalLeaderboard = globalLeaderboard.slice(0, 10); // Restrict table scope to Top 10

        try {
            const res = await fetch(BIN_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                body: JSON.stringify({ scores: globalLeaderboard })
            });
            if (res.ok) document.getElementById('networkStatus').innerText = "Cloud synchronization successful ✅";
            else document.getElementById('networkStatus').innerText = "Transmission rejection error ❌";
        } catch (err) {
            document.getElementById('networkStatus').innerText = "Network failure. Saved locally 💾";
        }
    }

    function renderLeaderboardUI() {
        const holder = document.getElementById('globalLeadGrid');
        holder.innerHTML = '';
        globalLeaderboard.forEach((item, idx) => {
            const isMe = item.name === playerWallet.nickname;
            const row = document.createElement('div');
            row.className = `leaderboard-row ${isMe ? 'highlight' : ''}`;
            row.innerHTML = `<span>${idx + 1}. ${item.name}</span><span>${item.score}</span>`;
            holder.appendChild(row);
        });
    }

    function buildCharacterGridUI() {
        const grid = document.getElementById('charGrid'); grid.innerHTML = '';
        characterDatabase.forEach(char => {
            const isUnlocked = playerWallet.unlocked.includes(char.id);
            const isSelected = playerWallet.activeSkin === char.id;
            const card = document.createElement('div');
            card.className = `char-card ${isSelected ? 'selected' : ''} ${!isUnlocked ? 'locked' : ''}`;
            let swatchStyle = `background: ${char.color}; border: 1px solid ${char.edge};`;
            if(char.isGold) swatchStyle = `background: linear-gradient(45deg, #f1c40f, #fff, #f39c12); border: 1px solid #b59410;`;
            card.innerHTML = `
                <div class="char-preview" style="${swatchStyle}"></div>
                <div style="font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:100%;">${char.name}</div>
                <div style="color: ${isSelected ? '#f1c40f' : '#94a3b8'}; margin-top:2px;">${isSelected ? 'EQUIPPED' : (isUnlocked ? 'USE' : '🪙'+char.price)}</div>
            `;
            card.addEventListener('click', () => handleCardInteraction(char));
            grid.appendChild(card);
        });
    }

    function handleCardInteraction(char) {
        unlockAudioContext();
        const isUnlocked = playerWallet.unlocked.includes(char.id);
        if (isUnlocked) { playerWallet.activeSkin = char.id; triggerSFX('jump'); }
        else {
            if (playerWallet.coins >= char.price) {
                playerWallet.coins -= char.price; playerWallet.unlocked.push(char.id); playerWallet.activeSkin = char.id; triggerSFX('score');
            } else { return alert("NEED FEATHERS!"); }
        }
        commitSavedState(); buildCharacterGridUI();
    }

    // --- GAME ENGINE IMPLEMENTATIONS ---
    class Bird {
        constructor() {
            this.radius = 13 * scale; this.x = 75 * scale; this.y = (virtualHeight / 2) * scale;
            this.velocity = 0; this.gravity = 0.38 * scale; this.lift = -7.2 * scale; this.tilt = 0;
            this.meta = characterDatabase.find(c => c.id === playerWallet.activeSkin) || characterDatabase[0];
        }
        update() {
            this.velocity += this.gravity; this.y += this.velocity;
            if (this.velocity < 0) this.tilt = Math.max(this.tilt - 0.08, -0.4);
            else this.tilt = Math.min(this.tilt + 0.06, 0.85);
            if (this.y < this.radius) { this.y = this.radius; this.velocity = 0; }
            if (this.y > canvas.height - (110 * scale)) triggerCrashSequence();
        }
        draw() {
            ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.tilt);
            if (skinLoadStatus[this.meta.id] === true && skinImages[this.meta.id].naturalWidth > 0) {
                ctx.drawImage(skinImages[this.meta.id], -this.radius * 1.5, -this.radius * 1.5, this.radius * 3, this.radius * 3);
            } else {
                ctx.fillStyle = this.meta.color; ctx.strokeStyle = this.meta.edge; ctx.lineWidth = 3 * scale;
                if(this.meta.isGold) {
                    let grad = ctx.createRadialGradient(-2,-2,2, 0,0,this.radius);
                    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.3, '#f1c40f'); grad.addColorStop(1, '#d35400'); ctx.fillStyle = grad;
                }
                ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5*scale, -3*scale, 3.5*scale, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(6*scale, -3*scale, 1.5*scale, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }
        flap() { this.velocity = this.lift; triggerSFX('jump'); }
    }

    class PipeObstacle {
        constructor() {
            this.width = 62 * scale; this.gap = 135 * scale; this.x = canvas.width; this.speed = 2.4 * scale; this.passed = false;
            const margin = 60 * scale; const usableRange = canvas.height - (110 * scale) - this.gap - (margin * 2);
            this.topHeight = margin + (Math.random() * usableRange); this.bottomY = this.topHeight + this.gap; this.bottomHeight = canvas.height - this.bottomY;
        }
        update() {
            this.x -= this.speed;
            if (birdEntity.x + birdEntity.radius > this.x && birdEntity.x - birdEntity.radius < this.x + this.width) {
                if (birdEntity.y - birdEntity.radius < this.topHeight || birdEntity.y + birdEntity.radius > this.bottomY) triggerCrashSequence();
            }
            if (!this.passed && this.x + this.width / 2 < birdEntity.x) { this.passed = true; currentScore++; triggerSFX('score'); }
        }
        draw() {
            ctx.fillStyle = '#2ecc71'; ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 3 * scale;
            ctx.fillRect(this.x, 0, this.width, this.topHeight); ctx.strokeRect(this.x, -5, this.width, this.topHeight + 5);
            ctx.fillRect(this.x, this.bottomY, this.width, this.bottomHeight); ctx.strokeRect(this.x, this.bottomY, this.width, this.bottomHeight + 5);
        }
    }

    function resetSession() { birdEntity = new Bird(); activePipes = []; currentScore = 0; ticks = 0; manageMusicPlayback(); }

    function triggerCrashSequence() {
        gameState = 'GAMEOVER'; manageMusicPlayback(); triggerSFX('death');
        playerWallet.coins += currentScore;
        if (currentScore > playerWallet.highScore) { playerWallet.highScore = currentScore; }
        commitSavedState();
        document.getElementById('scoreBadge').innerText = currentScore;
        document.getElementById('bestScore').innerText = playerWallet.highScore;
        document.getElementById('earnedCoins').innerText = currentScore;
        document.getElementById('gameOverMenu').classList.remove('hidden');
        pushScoreToCloud();
    }

    function runPipelineFrame() {
        if (bgLoaded && backgroundImage.naturalWidth > 0) {
            if (gameState === 'PLAYING') bgScrollX = (bgScrollX - 0.5) % canvas.width;
            ctx.drawImage(backgroundImage, bgScrollX, 0, canvas.width, canvas.height);
            ctx.drawImage(backgroundImage, bgScrollX + canvas.width, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#4ec0ca'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        if (gameState === 'PLAYING') {
            ticks++; if (ticks % 100 === 0) activePipes.push(new PipeObstacle());
            birdEntity.update();
            for (let i = activePipes.length - 1; i >= 0; i--) {
                activePipes[i].update(); activePipes[i].draw();
                if (activePipes[i].x + activePipes[i].width < 0) activePipes.splice(i, 1);
            }
        } else if (gameState === 'GAMEOVER') { activePipes.forEach(p => p.draw()); }
        
        birdEntity.draw();
        ctx.fillStyle = '#e67e22'; ctx.fillRect(0, canvas.height - (110 * scale), canvas.width, 8 * scale);
        ctx.fillStyle = '#d35400'; ctx.fillRect(0, canvas.height - (102 * scale), canvas.width, 102 * scale);

        if (gameState === 'PLAYING') {
            ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#000000'; ctx.lineWidth = 5 * scale;
            ctx.font = `bold ${40 * scale}px sans-serif`; ctx.textAlign = 'center';
            ctx.strokeText(currentScore, canvas.width / 2, 75 * scale); ctx.fillText(currentScore, canvas.width / 2, 75 * scale);
        }
        requestAnimationFrame(runPipelineFrame);
    }

    const deviceInteractiveInput = function (e) {
        if (e.cancelable) e.preventDefault();
        unlockAudioContext(); if (gameState === 'PLAYING') birdEntity.flap();
    };
    canvas.addEventListener('touchstart', deviceInteractiveInput, { passive: false });
    canvas.addEventListener('mousedown', deviceInteractiveInput);

    document.getElementById('saveIdentityBtn').addEventListener('click', saveNewIdentity);
    document.getElementById('startBtn').addEventListener('click', function () { unlockAudioContext(); gameState = 'PLAYING'; document.getElementById('mainMenu').classList.add('hidden'); resetSession(); });
    document.getElementById('restartBtn').addEventListener('click', function () { unlockAudioContext(); gameState = 'PLAYING'; document.getElementById('gameOverMenu').classList.add('hidden'); resetSession(); });
    document.getElementById('lobbyBtn').addEventListener('click', function () { unlockAudioContext(); gameState = 'MENU'; document.getElementById('gameOverMenu').classList.add('hidden'); document.getElementById('mainMenu').classList.remove('hidden'); checkIdentityMatrix(); });

    // --- INITIALIZE BOOT SEQUENCE ---
    initAssets();
    checkIdentityMatrix();
    resetSession();
    requestAnimationFrame(runPipelineFrame);
})();
</script>
</body>
</html>
